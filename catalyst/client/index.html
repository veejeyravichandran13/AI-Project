<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTA-7 · Program Control (mock)</title>
  <meta name="description" content="Mock UI for the GTA-7 AAA game development program management tool, built on Zoho Projects + custom modules.">
  <style>
/* =========================================================================
   GTA-7 Program Control — mock UI
   Dark "mission-control" design system.
   Palette: dataviz validated dark-surface categorical + fixed status ramp.
   ========================================================================= */

:root {
  color-scheme: dark;

  /* Surfaces / planes */
  --page:        #0d0d0d;
  --surface-1:   #1a1a19;   /* cards */
  --surface-2:   #201f1e;   /* raised / hover */
  --surface-3:   #262523;   /* inputs, chips */
  --rail:        #131312;   /* sidebar */

  /* Ink */
  --ink:         #ffffff;
  --ink-2:       #c3c2b7;
  --muted:       #898781;
  --grid:        #2c2c2a;
  --baseline:    #383835;
  --border:      rgba(255,255,255,0.10);
  --border-2:    rgba(255,255,255,0.06);

  /* Status (fixed, never themed) */
  --good:     #0ca30c;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;
  --good-ink: #0ca30c;

  /* Categorical (dark steps) */
  --c1: #3987e5;  /* blue   */
  --c2: #d95926;  /* orange */
  --c3: #199e70;  /* aqua   */
  --c4: #c98500;  /* yellow */
  --c5: #d55181;  /* magenta*/
  --c6: #008300;  /* green  */
  --c7: #9085e9;  /* violet */
  --c8: #e66767;  /* red    */

  --brand: #e8b923;   /* GTA gold accent */
  --brand-2: #f6cf3f;

  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 24px rgba(0,0,0,0.45);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  background: var(--page);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
h1,h2,h3,h4 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0; }

/* ---- Layout shell ---- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

/* ---- Sidebar ---- */
.rail {
  background: var(--rail);
  border-right: 1px solid var(--border-2);
  padding: 18px 14px;
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 16px; }
.brand .mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--brand), #b5850f);
  color: #1a1400; font-weight: 800; font-size: 15px;
  display: grid; place-items: center; letter-spacing: -0.04em;
  box-shadow: 0 2px 10px rgba(232,185,35,0.25);
}
.brand .txt b { display: block; font-size: 14px; letter-spacing: -0.01em; }
.brand .txt span { color: var(--muted); font-size: 11.5px; }

.nav-group { color: var(--muted); font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.09em; text-transform: uppercase; padding: 14px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  color: var(--ink-2); cursor: pointer; user-select: none;
  border: 1px solid transparent; font-size: 13px;
}
.nav-item .ic { width: 18px; text-align: center; opacity: .85; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--surface-2); color: var(--ink);
  border-color: var(--border); box-shadow: inset 3px 0 0 var(--brand); }
.nav-item .badge { margin-left: auto; }

/* ---- Main ---- */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 26px; background: rgba(13,13,13,0.82);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-2);
}
.topbar .crumb { color: var(--muted); font-size: 12.5px; }
.topbar .crumb b { color: var(--ink); font-weight: 600; }
.topbar .searchbox { margin-left: auto; position: relative; }
.topbar .search {
  background: var(--surface-3); border: 1px solid var(--border);
  border-radius: 999px; padding: 7px 14px; color: var(--ink);
  font-size: 12.5px; min-width: 240px; outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.topbar .search::placeholder { color: var(--muted); }
.topbar .search:focus {
  border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(144,133,233,0.18);
}
.search-results {
  position: absolute; top: calc(100% + 8px); right: 0; width: 400px; max-width: 80vw;
  max-height: 62vh; overflow-y: auto; padding: 6px;
  background: var(--surface-1); border: 1px solid var(--border-2);
  border-radius: 12px; box-shadow: var(--shadow); z-index: 50;
}
.search-results[hidden] { display: none; }
.sr-empty { padding: 14px 12px; color: var(--muted); font-size: 12.5px; }
.sr-hint { padding: 6px 10px 8px; color: var(--muted); font-size: 10.5px;
  border-top: 1px solid var(--border-2); margin-top: 4px; }
.sr-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
}
.sr-item:hover, .sr-item.active { background: var(--surface-2); }
.sr-kind {
  flex: none; font-size: 9px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; color: var(--muted); white-space: nowrap;
  border: 1px solid var(--border); border-radius: 5px;
  padding: 2px 6px; min-width: 62px; text-align: center;
}
.sr-main { min-width: 0; flex: 1; }
.sr-title { font-size: 12.5px; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-sub { font-size: 11px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-item mark { background: rgba(144,133,233,0.38); color: inherit; border-radius: 2px; }
.topbar .who { display: flex; align-items: center; gap: 9px; }
.avatar { width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg,#4a3aa7,#9085e9); display: grid;
  place-items: center; font-size: 12px; font-weight: 700; color: #fff; }

.view { padding: 24px 26px 60px; max-width: 1280px; width: 100%; }
.view h2.page { font-size: 22px; margin-bottom: 3px; }
.view .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

/* ---- Cards ---- */
.card {
  background: var(--surface-1); border: 1px solid var(--border-2);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.card .hd { display: flex; align-items: center; gap: 10px;
  padding: 15px 18px; border-bottom: 1px solid var(--border-2); }
.card .hd h3 { font-size: 14px; }
.card .hd .desc { color: var(--muted); font-size: 12px; }
.card .bd { padding: 18px; }
.card .hd .right { margin-left: auto; }

.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, 1fr); }
.g-3 { grid-template-columns: repeat(3, 1fr); }
.g-4 { grid-template-columns: repeat(4, 1fr); }
.g-12-a { grid-template-columns: 2fr 1fr; }
.g-12-b { grid-template-columns: 1fr 2fr; }
@media (max-width: 1000px){ .g-3,.g-4,.g-2,.g-12-a,.g-12-b{grid-template-columns:1fr;} }

/* ---- Stat tiles ---- */
.tile { padding: 16px 18px; }
.tile .lab { color: var(--muted); font-size: 11.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em; }
.tile .val { font-size: 30px; font-weight: 700; margin-top: 6px; letter-spacing: -0.02em; }
.tile .val small { font-size: 14px; color: var(--muted); font-weight: 500; }
.tile .delta { font-size: 12px; margin-top: 4px; display: inline-flex; gap: 5px; align-items: center; }
.delta.up { color: var(--good-ink); }
.delta.down { color: var(--critical); }
.delta.flat { color: var(--muted); }

/* ---- RAG health ---- */
.rag { display: flex; align-items: center; gap: 14px; }
.rag .light {
  width: 46px; height: 46px; border-radius: 12px; flex: none;
  display: grid; place-items: center; font-size: 20px;
}
.rag .light.green  { background: rgba(12,163,12,0.15);  color: var(--good);    box-shadow: inset 0 0 0 1px rgba(12,163,12,0.4); }
.rag .light.amber  { background: rgba(250,178,25,0.15); color: var(--warning); box-shadow: inset 0 0 0 1px rgba(250,178,25,0.4); }
.rag .light.red    { background: rgba(208,59,59,0.15);  color: var(--critical);box-shadow: inset 0 0 0 1px rgba(208,59,59,0.4); }
.rag .txt b { font-size: 15px; }
.rag .txt span { color: var(--muted); font-size: 12px; display:block; }

/* ---- Pills / chips ---- */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface-3); color: var(--ink-2);
  white-space: nowrap;
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; }
.pill.green { color:#7ee08a; background:rgba(12,163,12,0.14); border-color:rgba(12,163,12,0.35); }
.pill.amber { color:#ffd67a; background:rgba(250,178,25,0.13); border-color:rgba(250,178,25,0.35); }
.pill.red   { color:#ff9a9a; background:rgba(208,59,59,0.14);  border-color:rgba(208,59,59,0.35); }
.pill.blue  { color:#9cc6f5; background:rgba(57,135,229,0.14); border-color:rgba(57,135,229,0.35); }
.pill.violet{ color:#c3bcf5; background:rgba(144,133,233,0.14);border-color:rgba(144,133,233,0.35); }
.pill.grey  { color:var(--muted); }

/* severity + priority chips */
.sev { font-weight: 800; padding: 2px 7px; border-radius: 6px; font-size: 11px; letter-spacing: .02em; }
.sev.S0 { background:#4a0f0f; color:#ff8f8f; box-shadow: inset 0 0 0 1px rgba(208,59,59,.6);}
.sev.S1 { background:#4a2410; color:#ffb387; box-shadow: inset 0 0 0 1px rgba(236,131,90,.5);}
.sev.S2 { background:#463500; color:#ffd367; box-shadow: inset 0 0 0 1px rgba(250,178,25,.4);}
.sev.S3 { background:#123a2a; color:#7fe0b6; }
.sev.S4 { background:#20242c; color:#a9b4c4; }
.prio { font-weight:700; font-size:11px; color:var(--ink-2); }

/* ---- Tables ---- */
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.tbl th {
  text-align: left; color: var(--muted); font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.05em;
  padding: 9px 12px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface-1);
}
table.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--border-2); vertical-align: middle; }
table.tbl tr:hover td { background: var(--surface-2); }
table.tbl td.mono, table.tbl th.mono { font-variant-numeric: tabular-nums; }
.tid { color: var(--muted); font-family: ui-monospace, monospace; font-size: 11.5px; }

/* ---- Progress bars ---- */
.bar { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display:block; height:100%; border-radius:999px; background: var(--c1); }
.bar.sm { height: 6px; }
.barlab { display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-bottom:5px;}

/* ---- Roadmap / milestones ---- */
.timeline { display:flex; flex-direction:column; gap:0; position:relative; }
.ms {
  display:grid; grid-template-columns: 130px 1fr; gap:18px;
  padding:16px 0; border-bottom:1px solid var(--border-2); position:relative;
}
.ms:last-child { border-bottom:none; }
.ms .mnode { display:flex; flex-direction:column; gap:6px; }
.ms .mnode .mcode { font-weight:800; font-size:15px; }
.ms .mnode .mdate { color:var(--muted); font-size:11.5px; }
.ms .mbody h4 { font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
.ms .mbody .crit { color:var(--ink-2); font-size:12.5px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }

/* ---- Tree (backlog) ---- */
.tree { font-size:13px; }
.node { border-left:2px solid var(--border); margin-left:6px; }
.node .row {
  display:flex; align-items:center; gap:10px; padding:8px 10px; cursor:pointer;
  border-radius:7px;
}
.node .row:hover { background: var(--surface-2); }
.node .row .tw { width:14px; color:var(--muted); font-size:11px; }
.kind { font-size:10px; font-weight:800; letter-spacing:.05em; padding:2px 6px; border-radius:5px; }
.kind.EPIC{background:rgba(144,133,233,.18);color:#c3bcf5;}
.kind.FEATURE{background:rgba(57,135,229,.16);color:#9cc6f5;}
.kind.STORY{background:rgba(25,158,112,.16);color:#7fe0b6;}
.kind.TASK{background:rgba(201,133,0,.16);color:#ffd367;}
.kind.TEST{background:rgba(0,131,0,.18);color:#8fe08f;}
.kind.BUG{background:rgba(208,59,59,.16);color:#ff9a9a;}
.node .children { margin-left:18px; }
.hide { display:none; }

/* ---- Governance org chart ---- */
.org { display:flex; flex-direction:column; align-items:center; gap:0; }
.org .lvl { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
.org .conn { width:2px; height:18px; background:var(--baseline); }
.orgbox {
  background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
  padding:9px 14px; text-align:center; min-width:150px;
}
.orgbox b{ display:block; font-size:12.5px;}
.orgbox span{ color:var(--muted); font-size:11px;}
.orgbox.rock { border-color: rgba(232,185,35,.4); box-shadow: inset 0 0 0 1px rgba(232,185,35,.15);}
.orgbox.vend { border-color: rgba(57,135,229,.4); }

/* ---- Matrix ---- */
.matrix td.dep { color:var(--ink-2); }
.matrix .yes { color: var(--c1); font-weight:700; }

/* ---- Misc ---- */
.kv { display:grid; grid-template-columns: 130px 1fr; gap:6px 14px; font-size:12.5px; }
.kv dt { color:var(--muted); }
.kv dd { margin:0; color:var(--ink); }
.checklist { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:9px; }
.checklist li { display:flex; align-items:flex-start; gap:10px; font-size:12.5px; color:var(--ink-2); }
.checklist .box { width:16px; height:16px; border-radius:5px; flex:none; display:grid; place-items:center; font-size:10px;
  background:var(--surface-3); border:1px solid var(--border); color:var(--muted);}
.checklist .box.on { background:rgba(12,163,12,.2); color:#7ee08a; border-color:rgba(12,163,12,.4);}
.legend { display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-top:10px;}
.legend i { width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle;}
.note {
  background: rgba(57,135,229,.07); border:1px solid rgba(57,135,229,.25);
  border-radius:10px; padding:12px 14px; font-size:12.5px; color:var(--ink-2);
}
.note b{ color:var(--ink);}
.note.gold { background: rgba(232,185,35,.06); border-color: rgba(232,185,35,.3);}

/* bars chart (severity) */
.hbars { display:flex; flex-direction:column; gap:10px; }
.hbar { display:grid; grid-template-columns: 40px 1fr 40px; align-items:center; gap:10px; font-size:12px;}
.hbar .track { height:14px; background:var(--surface-3); border-radius:6px; overflow:hidden;}
.hbar .track > i { display:block; height:100%; border-radius:6px;}
.hbar .n { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-2);}

/* donut via conic */
.donut { width:150px; height:150px; border-radius:50%; position:relative; margin:4px auto; }
.donut::after { content:""; position:absolute; inset:26px; border-radius:50%; background:var(--surface-1);}
.donut .mid { position:absolute; inset:0; display:grid; place-items:center; z-index:2; text-align:center;}
.donut .mid b{ font-size:22px;} .donut .mid span{ color:var(--muted); font-size:10.5px; display:block;}

.section-title { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
  font-weight:700; margin: 26px 0 12px;}

.zoho-tag { display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
.zoho-tag b { color:var(--brand-2); font-weight:700; }

.tabs { display:flex; gap:4px; border-bottom:1px solid var(--border-2); margin-bottom:18px; }
.tab { padding:9px 14px; color:var(--muted); cursor:pointer; font-size:13px; border-bottom:2px solid transparent;}
.tab.active { color:var(--ink); border-bottom-color:var(--brand); }

.field { background:var(--surface-3); border:1px solid var(--border); border-radius:7px;
  padding:8px 11px; font-size:12px; display:flex; align-items:center; gap:8px;}
.field .ft { color:var(--muted); font-size:10.5px; margin-left:auto; text-transform:uppercase; letter-spacing:.04em;}
.fieldgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; }
@media (max-width:800px){ .fieldgrid{grid-template-columns:1fr;} }

.mono-block { font-family: ui-monospace, monospace; font-size:12px; color:var(--ink-2);
  background:var(--page); border:1px solid var(--border-2); border-radius:8px; padding:14px; white-space:pre; overflow-x:auto;}

/* ---- Hero banner (Vice City synthwave) ---- */
.hero {
  position: relative; border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 18px;
  min-height: 190px; display: flex; align-items: flex-end;
}
.hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.hero .scrim {
  position:absolute; inset:0;
  background: linear-gradient(90deg, rgba(13,13,13,0.86) 0%, rgba(13,13,13,0.55) 42%, rgba(13,13,13,0.05) 72%);
}
.hero .hero-in { position:relative; padding: 22px 26px; max-width: 640px; }
.hero .eyebrow {
  display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--brand-2);
  background:rgba(0,0,0,0.35); border:1px solid rgba(232,185,35,.35);
  padding:4px 10px; border-radius:999px; margin-bottom:12px;
}
.hero h1 {
  font-size: 40px; line-height:1; letter-spacing:-0.03em; margin:0 0 8px;
  color:#fff; text-shadow: 0 2px 18px rgba(0,0,0,.55);
}
.hero h1 span { color: var(--brand-2); }
.hero .tag { color:#f3e8d6; font-size:13.5px; max-width:520px; text-shadow:0 1px 8px rgba(0,0,0,.6); }
.hero .hero-stats { display:flex; gap:22px; margin-top:14px; }
.hero .hero-stats div b { display:block; font-size:19px; color:#fff; }
.hero .hero-stats div span { font-size:11px; color:#e9d9c4; text-transform:uppercase; letter-spacing:.05em; }
@media (max-width:760px){ .hero h1{font-size:30px;} .hero .scrim{background:linear-gradient(0deg,rgba(13,13,13,0.9),rgba(13,13,13,0.35));} }

/* ---- Sprint board (Kanban) ---- */
.kanban { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; align-items:start; }
@media (max-width:1100px){ .kanban{ grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .kanban{ grid-template-columns:1fr;} }
.kcol { background:var(--surface-1); border:1px solid var(--border-2); border-radius:var(--radius); }
.kcol .khd { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border-2);
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-2); }
.kcol .khd .cnt { margin-left:auto; color:var(--muted); font-weight:700; font-size:11px;
  background:var(--surface-3); border:1px solid var(--border); border-radius:999px; padding:1px 8px; }
.kcol .kbody { padding:10px; display:flex; flex-direction:column; gap:9px; min-height:60px; }
.kcard { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:10px 11px; box-shadow:0 4px 12px rgba(0,0,0,.25); }
.kcard .ktop { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.kcard .ktop .tid { font-size:10.5px; }
.kcard .ktitle { font-size:12.5px; color:var(--ink); line-height:1.35; }
.kcard .kfoot { display:flex; align-items:center; gap:8px; margin-top:9px; }
.kcard .pts { margin-left:auto; font-size:11px; font-weight:700; color:var(--ink-2);
  background:var(--surface-3); border:1px solid var(--border); border-radius:6px; padding:1px 7px; }
.kcard .who { width:24px; height:24px; border-radius:50%; display:grid; place-items:center;
  font-size:9.5px; font-weight:700; color:#fff; }
.who.AI{ background:linear-gradient(135deg,#4a3aa7,#9085e9);} .who.VEH{ background:linear-gradient(135deg,#8a3b12,#d95926);}
.who.MIS{ background:linear-gradient(135deg,#0b5c78,#199e70);} .who.QA{ background:linear-gradient(135deg,#0a5a0a,#0ca30c);}

/* ---------- Global search ---------- */
/* Builds a flat, searchable index across every DATA collection each query so
   it always reflects live (Zoho-hydrated) or embedded data. Each entry knows
   which view to route to when picked. */
function buildSearchIndex(){
  const idx = [];
  const push = (kind, id, title, view, sub, extra) => idx.push({
    kind, id: id==null?"":String(id), title: title==null?"":String(title), view,
    sub: sub==null?"":String(sub),
    hay: (String(id||"")+" "+String(title||"")+" "+String(sub||"")+" "+String(extra||"")).toLowerCase()
  });

  (DATA.milestones||[]).forEach(m=> push("Milestone", m.code, m.name, "roadmap", m.date, m.criteria));
  (DATA.bugs||[]).forEach(b=> push("Bug", b.id, b.title, "bugs", (b.sev||"")+" · "+(b.area||"")+" · "+(b.status||""), b.owner));
  (DATA.usecases||[]).forEach(u=> push("Use Case", u.id, u.title, "usecases", u.area, u.fr));
  (DATA.risks||[]).forEach(r=> push("Risk", r.id, r.risk, "risks", (r.rag?r.rag.toUpperCase():"")+" · "+(r.owner||""), r.mit));
  (DATA.vendors||[]).forEach(v=> push("Vendor", v.name, v.scope, "vendors", v.milestone));
  (DATA.dependencies||[]).forEach(d=> push("Dependency", d.feature, d.feature, "deps", "Depends on: "+((d.deps||[]).join(", "))));
  (((DATA.board||{}).cards)||[]).forEach(c=> push("Board", c.key, c.t, "board", (c.col||"")+" · "+(c.tag||"")));
  (DATA.zohoDefault||[]).forEach(z=> push("Zoho Module", z.mod, z.use, "zoho", z.fields));
  (DATA.zohoCustom||[]).forEach(z=> push("Zoho Custom", z.mod, z.why, "zoho", ""));
  (function walk(nodes){ (nodes||[]).forEach(n=>{
    push(n.kind||"Item", n.id, n.title, "backlog", n.owner||"", "");
    if(n.children) walk(n.children);
  }); })(DATA.backlog);
  return idx;
}

function initSearch(){
  const input = document.getElementById("search");
  const panel = document.getElementById("searchResults");
  if(!input || !panel) return;
  let results = [], active = -1;

  const markUp = (text, q) => {
    const s = String(text);
    const i = q ? s.toLowerCase().indexOf(q) : -1;
    if(i < 0) return esc(s);
    return esc(s.slice(0,i)) + "<mark>" + esc(s.slice(i, i+q.length)) + "</mark>" + esc(s.slice(i+q.length));
  };

  function renderPanel(qRaw){
    const q = qRaw.toLowerCase();
    panel.innerHTML = "";
    if(!results.length){
      panel.appendChild(el("div","sr-empty",`No matches for “${esc(qRaw)}”`));
      return;
    }
    results.forEach((r,i)=>{
      const row = el("div","sr-item"+(i===active?" active":""));
      row.innerHTML =
        `<span class="sr-kind">${esc(r.kind)}</span>`+
        `<div class="sr-main"><div class="sr-title">${markUp(r.title,q)}</div>`+
        `<div class="sr-sub">${markUp(r.id,q)}${r.sub?" · "+esc(r.sub):""}</div></div>`;
      row.onmousedown = e=>{ e.preventDefault(); choose(i); };
      panel.appendChild(row);
    });
    panel.appendChild(el("div","sr-hint","↑ ↓ to navigate · ↵ to open · esc to close"));
    const act = panel.querySelector(".sr-item.active");
    if(act) act.scrollIntoView({ block:"nearest" });
  }

  const openPanel  = ()=>{ panel.hidden = false; };
  const closePanel = ()=>{ panel.hidden = true; active = -1; };

  function choose(i){
    const r = results[i]; if(!r) return;
    route(r.view);
    input.value = ""; results = []; closePanel(); input.blur();
  }

  function runSearch(){
    const raw = input.value.trim();
    const q = raw.toLowerCase();
    if(!q){ results = []; closePanel(); return; }
    const seen = new Set();
    results = buildSearchIndex()
      .filter(r=> r.hay.indexOf(q) !== -1)
      .filter(r=>{ const k = r.view+"|"+r.kind+"|"+r.id; if(seen.has(k)) return false; seen.add(k); return true; })
      .slice(0, 12);
    active = results.length ? 0 : -1;
    renderPanel(raw);
    openPanel();
  }

  input.addEventListener("input", runSearch);
  input.addEventListener("focus", ()=>{ if(input.value.trim()) runSearch(); });
  input.addEventListener("keydown", e=>{
    if(panel.hidden) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); active = Math.min(active+1, results.length-1); renderPanel(input.value.trim()); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); active = Math.max(active-1, 0); renderPanel(input.value.trim()); }
    else if(e.key==="Enter"){ e.preventDefault(); if(active>=0) choose(active); }
    else if(e.key==="Escape"){ closePanel(); input.blur(); }
  });
  document.addEventListener("click", e=>{ if(!e.target.closest(".searchbox")) closePanel(); });
  // "/" focuses the search box from anywhere (unless already typing in a field)
  document.addEventListener("keydown", e=>{
    if(e.key==="/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
      e.preventDefault(); input.focus();
    }
  });
}

function route(id){
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active", n.dataset.view===id));
  const v = VIEWS[id] || VIEWS.dashboard;
  document.getElementById("crumb").innerHTML = `Program Control <span>›</span> <b>${v.title}</b>`;
  const root = document.getElementById("view");
  root.innerHTML = `<h2 class="page">${v.title}</h2><div class="sub">${v.sub}</div>`;
  v.render(root);
  window.scrollTo({ top: 0 });
  location.hash = id;
}

function card(title, desc, bodyEl, rightHtml){
  const c = el("div","card");

  hd.appendChild(el("div",null,`<h3>${title}</h3>${desc?`<div class="desc">${desc}</div>`:""}`));
  if(rightHtml) hd.appendChild(el("div","right",rightHtml));
  c.appendChild(hd);
  const bd = el("div","bd"); if(bodyEl) bd.appendChild(bodyEl); c.appendChild(bd);
  return c;
}

function renderNode(n, depth=0){
  const node = el("div","node");
  const row = el("div","row");
  const hasKids = n.children && n.children.length;
  row.innerHTML = `<span class="tw">${hasKids?"▸":"·"}</span>
    <span class="kind ${n.kind}">${n.kind}</span>
    <span class="tid">${n.id}</span>
    <span style="flex:1">${esc(n.title)}</span>
    ${n.owner?`<span class="pill grey">${n.owner}</span>`:""}
    ${n.status?ragPill(n.status):""}`;
  node.appendChild(row);
  if(hasKids){
    const kids = el("div","children"+(depth>=1?" hide":""));
    n.children.forEach(c=>kids.appendChild(renderNode(c, depth+1)));
    node.appendChild(kids);
    const tw = row.querySelector(".tw");
    row.onclick = ()=>{ kids.classList.toggle("hide"); tw.textContent = kids.classList.contains("hide")?"▸":"▾"; };
    if(!kids.classList.contains("hide")) tw.textContent="▾";
  }
  return node;
}

      });
      kc.appendChild(body);
      board.appendChild(kc);
    });
    root.appendChild(card("Current Sprint · GTA-7 · Sprint 42",
      "Backlog → To Do → In Progress → In Review → Done", board,
      zohoTag("Tasks + custom sprint field")));
    const total = DATA.board.cards.reduce((a,c)=>a+c.pts,0);
    const done = DATA.board.cards.filter(c=>c.col==="Done").reduce((a,c)=>a+c.pts,0);
    const row = el("div","grid g-4"); row.style.marginTop="16px";
    row.appendChild(el("div","card tile",`<div class="lab">Committed</div><div class="val">${total}<small> pts</small></div>`));
    row.appendChild(el("div","card tile",`<div class="lab">Completed</div><div class="val">${done}<small> pts</small></div>`));
    row.appendChild(el("div","card tile",`<div class="lab">In Progress</div><div class="val">${DATA.board.cards.filter(c=>c.col==="In Progress").length}<small> cards</small></div>`));
    row.appendChild(el("div","card tile",`<div class="lab">Sprint Health</div><div class="val" style="font-size:22px">${ragPill("amber","AMBER")}</div>`));
    root.appendChild(row);
  }
};

/* =========================================================================
   VIEW: Performance & Compatibility
   ========================================================================= */
VIEWS.perf = { title:"Performance & Compatibility", sub:"Dedicated performance program — FPS, CPU/GPU budgets, memory and loading tracked target-vs-actual per build. Current build fails the city FPS target.",
  render(root){
    const p = DATA.perf;
    const stColor = st => st==="Pass" ? "green" : st==="At Risk" ? "amber" : st==="Fail" ? "red" : "grey";
    function metricSection(title, rows){
      const wrap = el("div","metrics");
      rows.forEach(m=>{
        const pct = Math.max(6, Math.min(100, Math.round((m.act/m.tgt)*100)));
        const fill = m.bad ? "var(--critical)" : "var(--good)";
        wrap.appendChild(el("div","metric",
          `<div class="mtop"><b>${esc(m.k)}</b>
             <span class="mval" style="color:${m.bad?'#ff9a9a':'#7ee08a'}">${m.act}${m.unit}</span>
             <span class="mtgt">/ tgt ${m.tgt}${m.unit}</span></div>
           <div class="track"><i style="width:${pct}%;background:${fill}"></i></div>`));
      });
      return card(title, null, wrap);
    }
    const g1 = el("div","grid g-2");
    g1.appendChild(metricSection("Frame Rate", p.fps));
    g1.appendChild(metricSection("CPU Budget (ms / frame)", p.budgets));
    root.appendChild(g1);
    const g2 = el("div","grid g-2"); g2.style.marginTop="16px";
    g2.appendChild(metricSection("Memory", p.memory));
    g2.appendChild(metricSection("Loading (seconds)", p.loading));
    root.appendChild(g2);

    const tbl = el("table","tbl");
    tbl.innerHTML = `<thead><tr><th>Platform / Config</th><th>Certification Status</th></tr></thead>
      <tbody>${p.compat.map(c=>`<tr><td><b>${esc(c.p)}</b></td><td>${ragPill(stColor(c.st),c.st)}</td></tr>`).join("")}</tbody>`;
    const compatCard = card("Compatibility Matrix","Target platforms & configurations", tbl, zohoTag("custom Build Releases module"));
    compatCard.style.marginTop="16px";
    root.appendChild(compatCard);

    root.appendChild(el("div","note gold",
      "<b>Perf gate:</b> M4 exit requires 60 FPS avg + 45 FPS 1%-low in the dense city district on target consoles. Current build is <b>RED</b> on Game-Thread and VRAM budgets — flagged in the risk register (R-02)."))
      .style.marginTop="16px";
  }
};

/* ---------- boot ---------- */
/* Data source: when this SPA is served from Zoho Catalyst, it hydrates DATA
   from the zoho-proxy Catalyst Function (which reads the live GTA-7 Zoho
   Projects portal, server-side, using a rotated OAuth token). When the fetch
   is unavailable (e.g. the static GitHub Pages / file:// copy), it silently
   falls back to the embedded sample DATA below, so the deck always renders. */
(function boot(){
  function start(){
    buildNav();
    initSearch();
    route(location.hash?.slice(1) && VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "dashboard");
  }
  var PROXY = (typeof window!=="undefined" && window.GTA7_PROXY_URL) || "/server/zoho-proxy/data";
  var ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 6000);
  try {
    fetch(PROXY, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function(r){ if(!r.ok) throw new Error("proxy HTTP "+r.status); return r.json(); })
      .then(function(payload){
        var src = (payload && payload.data) ? payload.data : payload;
        if (src && typeof src === "object") {
          Object.keys(src).forEach(function(k){ if (src[k] != null) DATA[k] = src[k]; });
          DATA.__source = "zoho";
        }
      })
      .catch(function(){ DATA.__source = "embedded"; })
      .finally(function(){ clearTimeout(timer); start(); });
  } catch(e) {
    clearTimeout(timer); DATA.__source = "embedded"; start();
  }
})();

</script>
